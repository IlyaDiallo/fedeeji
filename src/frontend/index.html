<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17253f">
    <title>Feddeeji</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-background" aria-hidden="true">
        <span></span><span></span><span></span>
    </div>

    <nav class="navbar navbar-expand-xl app-navbar" aria-label="Navigation principale">
        <div class="container-fluid app-nav-container">
            <a class="navbar-brand" href="/" data-link id="navbar-brand">
                <span class="brand-mark" aria-hidden="true">
                    <img id="brand-logo" class="d-none" alt="">
                    <i class="bi bi-people-fill" id="brand-default-icon"></i>
                </span>
                <span class="brand-copy">
                    <strong id="brand-name">Feddeeji</strong>
                    <small id="brand-context">Espace</small>
                </span>
            </a>
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false"
                aria-label="Ouvrir le menu">
                <i class="bi bi-list"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto" id="nav-links"></ul>
                <div class="nav-utilities">
                    <span id="user-info" class="user-chip d-none"></span>
                    <label class="lang-control" for="lang-selector">
                        <i class="bi bi-translate" aria-hidden="true"></i>
                        <span class="visually-hidden">Langue</span>
                        <select id="lang-selector" class="form-select form-select-sm">
                            <option value="fr">FR</option>
                            <option value="en">EN</option>
                        </select>
                    </label>
                    <button id="logout-btn" class="btn btn-logout d-none"
                        title="Déconnexion" data-i18n-title="logout">
                        <i class="bi bi-box-arrow-right"></i>
                        <span class="d-xl-none" data-i18n="logout">Déconnexion</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid app-shell" id="app" tabindex="-1"></main>

    <nav id="mobile-nav" class="mobile-nav d-none"
        aria-label="Navigation mobile"></nav>

    <div id="modal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/RecurrenceUtils.js"></script>
    <script src="/js/ActionUtils.js"></script>
    <script src="/js/ActionOccurrenceResolver.js"></script>
    <script src="/js/IllustrationPicker.js"></script>
    <script src="/js/ProgrammeRenderers.js"></script>
    <script src="/js/ActionFormManager.js"></script>
    <script src="/js/LogFormManager.js"></script>
    <script src="/js/views/AbstractView.js"></script>
    <script src="/js/views/LoginView.js"></script>
    <script src="/js/views/RegisterView.js"></script>
    <script src="/js/views/CollectiveListView.js"></script>
    <script src="/js/views/HomeView.js"></script>
    <script src="/js/views/MembersView.js"></script>
    <script src="/js/views/ContributionsView.js"></script>
    <script src="/js/views/EventsView.js"></script>
    <script src="/js/views/ActivitiesView.js"></script>
    <script src="/js/views/ActivityRunView.js"></script>
    <script src="/js/views/InscriptionsView.js"></script>
    <script src="/js/views/InscriptionScheduleView.js"></script>
    <script src="/js/views/ProgrammeView.js"></script>
    <script src="/js/views/ActionHistoryView.js"></script>
    <script src="/js/views/TrashView.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
