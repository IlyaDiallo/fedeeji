<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Feddeeji - Gestion de collectif</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/" data-link id="navbar-brand">Feddeeji</a>
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto" id="nav-links">
                </ul>
                <div class="d-flex align-items-center">
                    <span id="user-info"
                        class="text-light me-3 small d-none">
                    </span>
                    <select id="lang-selector"
                        class="form-select form-select-sm me-3"
                        style="width: auto;">
                        <option value="fr">Français</option>
                        <option value="en">English</option>
                    </select>
                    <button id="logout-btn"
                        class="btn btn-outline-light btn-sm d-none"
                        data-i18n="logout">
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4" id="app">
    </div>

    <!-- Modals -->
    <div id="modal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/RecurrenceUtils.js"></script>
    <script src="/js/ActionUtils.js"></script>
    <script src="/js/views/AbstractView.js"></script>
    <script src="/js/views/LoginView.js"></script>
    <script src="/js/views/RegisterView.js"></script>
    <script src="/js/views/CollectiveListView.js"></script>
    <script src="/js/views/HomeView.js"></script>
    <script src="/js/views/MembersView.js"></script>
    <script src="/js/views/ContributionsView.js"></script>
    <script src="/js/views/EventsView.js"></script>
    <script src="/js/views/InscriptionsView.js"></script>
    <script src="/js/views/InscriptionScheduleView.js"></script>
    <script src="/js/views/ProfileView.js"></script>
    <script src="/js/views/ProgrammeView.js"></script>
    <script src="/js/views/ActionHistoryView.js"></script>
    <script src="/js/views/TrashView.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
